name: sketchflutter
description: Éditeur visuel d'applications Flutter - Créez, prévisualisez et compilez des apps sans coder.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Utilitaires
  path_provider: ^2.1.3          # Accès aux répertoires documents/temp
  archive: ^3.6.1                # Compression/décompression gzip (format .mub)
  http: ^1.2.1                   # Appels API GitHub, téléchargements
  shared_preferences: ^2.2.3     # Préférences utilisateur (mode sombre, autosave...)

  # Sérialisation JSON
  json_annotation: ^4.9.0        # Annotations pour la génération de code

  # Autres dépendances utiles
  cupertino_icons: ^1.0.8        # Icônes iOS (optionnel)

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9           # Génération de code (json_serializable)
  json_serializable: ^6.8.0      # Génération des fromJson/toJson
  flutter_lints: ^4.0.0          # Recommandations de style

flutter:
  uses-material-design: true

  # Assets de l'éditeur
  assets:
    - assets/icons/              # Icônes personnalisées de la palette
    - assets/templates/          # Modèles de projets (vierge, login, etc.)